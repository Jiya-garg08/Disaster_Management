<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Relief Dashboard — Relief Resolver</title>


    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Leaflet -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <style>

        :root {

            --dashboard-paper: #f7f4ed;
            --dashboard-white: #fffdf9;
            --dashboard-ink: #071525;
            --dashboard-muted: #61748b;
            --dashboard-line: #ddd7cc;
            --dashboard-red: #b83d34;
            --dashboard-green: #2f8b52;
            --dashboard-blue: #2563a6;
            --dashboard-yellow: #e2a83b;

        }


        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(184, 61, 52, 0.07),
                    transparent 30%
                ),
                var(--dashboard-paper);

            color:
                var(--dashboard-ink);

            font-family:
                Inter,
                sans-serif;

        }


        /* =========================================================
           NAVBAR
           ========================================================= */

        .dashboard-nav {

            min-height: 76px;

            background:
                rgba(255, 253, 249, 0.96);

            border-bottom:
                1px solid var(--dashboard-line);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0 5vw;

            position: sticky;

            top: 0;

            z-index: 1000;

        }


        .dashboard-brand {

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 1.4px;

        }


        .dashboard-brand span {

            display: inline-block;

            width: 8px;

            height: 8px;

            border-radius: 50%;

            background:
                var(--dashboard-red);

            margin-right: 8px;

        }


        .dashboard-user {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .user-avatar {

            width: 38px;

            height: 38px;

            border-radius: 50%;

            background:
                var(--dashboard-ink);

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: 700;

        }


        .user-name {

            font-weight: 700;

        }


        .logout-button {

            border: 0;

            background: transparent;

            color:
                var(--dashboard-red);

            font-weight: 700;

            cursor: pointer;

            margin-left: 12px;

        }


        /* =========================================================
           PAGE
           ========================================================= */

        .dashboard-page {

            width:
                min(1180px, 92%);

            margin:
                0 auto;

            padding:
                55px 0 80px;

        }


        .dashboard-heading {

            margin-bottom: 35px;

        }


        .dashboard-eyebrow {

            color:
                var(--dashboard-red);

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 1.8px;

            text-transform: uppercase;

            margin-bottom: 10px;

        }


        .dashboard-heading h1 {

            margin: 0;

            font-family:
                Fraunces,
                serif;

            font-size:
                clamp(42px, 6vw, 70px);

            line-height: 0.95;

            letter-spacing: -2px;

        }


        .dashboard-heading h1 em {

            color:
                var(--dashboard-red);

            font-weight: 500;

        }


        .dashboard-heading p {

            max-width: 720px;

            margin-top: 18px;

            color:
                var(--dashboard-muted);

            font-size: 16px;

            line-height: 1.7;

        }


        /* =========================================================
           STATUS BAR
           ========================================================= */

        .status-card {

            background:
                var(--dashboard-ink);

            color: white;

            border-radius: 16px;

            padding: 26px 30px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;

            margin-bottom: 28px;

            box-shadow:
                0 18px 45px rgba(7, 21, 37, 0.12);

        }


        .status-label {

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            opacity: 0.65;

            margin-bottom: 7px;

        }


        .status-title {

            font-size: 22px;

            font-weight: 700;

        }


        .status-pill {

            padding:
                11px 17px;

            border-radius: 999px;

            background:
                rgba(255,255,255,0.10);

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 0.7px;

            text-transform: uppercase;

            white-space: nowrap;

        }


        .status-pill.pending {

            color: #ffd98a;

        }


        .status-pill.verified {

            color: #8ce3a8;

        }


        .status-pill.coordinating {

            color: #8cc7ff;

        }


        .status-pill.received {

            color: #8ce3a8;

        }


        /* =========================================================
           GRID
           ========================================================= */

        .dashboard-grid {

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1.25fr);

            gap: 24px;

        }


        .card {

            background:
                var(--dashboard-white);

            border:
                1px solid var(--dashboard-line);

            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                0 12px 35px rgba(7, 21, 37, 0.045);

        }


        .card-header {

            padding:
                25px 27px 20px;

            border-bottom:
                1px solid var(--dashboard-line);

        }


        .card-header h2 {

            margin: 0;

            font-size: 20px;

        }


        .card-header p {

            margin:
                7px 0 0;

            color:
                var(--dashboard-muted);

            font-size: 13px;

            line-height: 1.5;

        }


        .card-body {

            padding: 27px;

        }


        /* =========================================================
           REQUEST INFORMATION
           ========================================================= */

        .request-id-box {

            padding:
                17px 18px;

            background:
                #f2eee5;

            border-left:
                4px solid var(--dashboard-red);

            margin-bottom: 22px;

        }


        .request-id-label {

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 1.3px;

            color:
                var(--dashboard-muted);

            margin-bottom: 7px;

        }


        .request-id {

            font-weight: 800;

            font-size: 17px;

            letter-spacing: 0.5px;

        }


        .info-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;

        }


        .info-item {

            padding:
                17px;

            background:
                #f5f1e9;

            border-radius: 10px;

        }


        .info-item.full {

            grid-column:
                1 / -1;

        }


        .info-label {

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 1px;

            color:
                var(--dashboard-muted);

            margin-bottom: 7px;

        }


        .info-value {

            font-size: 14px;

            font-weight: 700;

            line-height: 1.5;

        }


        .supply-tag {

            display: inline-block;

            padding:
                8px 11px;

            background:
                #f9e9e5;

            color:
                var(--dashboard-red);

            font-size: 11px;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 0.7px;

        }


        /* =========================================================
           MAP
           ========================================================= */

        #reliefMap {

            height: 510px;

            width: 100%;

        }


        .map-legend {

            padding:
                15px 20px;

            display: flex;

            gap: 22px;

            flex-wrap: wrap;

            border-top:
                1px solid var(--dashboard-line);

            font-size: 11px;

            color:
                var(--dashboard-muted);

        }


        .legend-item {

            display: flex;

            align-items: center;

            gap: 7px;

        }


        .legend-dot {

            width: 12px;

            height: 12px;

            border-radius: 50%;

        }


        .legend-dot.you {

            background:
                var(--dashboard-red);

        }


        .legend-dot.ngo {

            background:
                var(--dashboard-green);

        }


        .legend-dot.other {

            background:
                var(--dashboard-blue);

        }


        /* =========================================================
           NGO PARTNER
           ========================================================= */

        .partner-card {

            margin-top: 24px;

            border:
                1px solid #cfe2d5;

            background:
                #f1f8f3;

            border-radius: 14px;

            padding: 23px;

        }


        .partner-top {

            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 15px;

        }


        .partner-label {

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 1.4px;

            color:
                var(--dashboard-green);

            font-weight: 800;

        }


        .partner-name {

            font-size: 23px;

            font-weight: 800;

            margin-top: 6px;

        }


        .verified-badge {

            background:
                #dff1e5;

            color:
                #277744;

            padding:
                7px 10px;

            font-size: 9px;

            font-weight: 800;

            text-transform: uppercase;

            white-space: nowrap;

        }


        .partner-details {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin-top: 20px;

        }


        .partner-detail {

            padding:
                14px;

            background:
                rgba(255,255,255,0.65);

            border-radius: 9px;

        }


        .partner-detail strong {

            display: block;

            margin-top: 5px;

            font-size: 13px;

        }


        .partner-detail small {

            color:
                var(--dashboard-muted);

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 0.8px;

        }


        .partner-message {

            margin-top: 17px;

            padding-top: 17px;

            border-top:
                1px solid #cfe2d5;

            color:
                #39704a;

            font-size: 12px;

            line-height: 1.6;

        }


        .waiting-card {

            margin-top: 24px;

            padding: 24px;

            background:
                #fff7e3;

            border-left:
                4px solid var(--dashboard-yellow);

            color:
                #77591e;

            font-size: 13px;

            line-height: 1.6;

        }


        /* =========================================================
           REVIEW
           ========================================================= */

        .review-section {

            margin-top: 24px;

        }


        .review-intro {

            color:
                var(--dashboard-muted);

            font-size: 13px;

            line-height: 1.6;

            margin-bottom: 22px;

        }


        .received-button {

            width: 100%;

            border: none;

            background:
                var(--dashboard-green);

            color: white;

            padding:
                16px;

            border-radius: 9px;

            font-weight: 800;

            letter-spacing: 0.7px;

            cursor: pointer;

            font-size: 12px;

        }


        .received-button:hover {

            filter:
                brightness(0.95);

        }


        .review-form {

            display: none;

            margin-top: 22px;

            padding-top: 22px;

            border-top:
                1px solid var(--dashboard-line);

        }


        .review-form.show {

            display: block;

        }


        .rating {

            display: flex;

            gap: 7px;

            margin:
                10px 0 20px;

        }


        .star {

            width: 42px;

            height: 42px;

            border: 1px solid var(--dashboard-line);

            background:
                white;

            border-radius: 8px;

            cursor: pointer;

            font-size: 20px;

        }


        .star.selected {

            background:
                #fff0bd;

            border-color:
                #e1b73e;

        }


        .review-form textarea {

            width: 100%;

            min-height: 100px;

            resize: vertical;

            border:
                1px solid var(--dashboard-line);

            padding:
                13px;

            font-family:
                Inter,
                sans-serif;

            outline: none;

        }


        .review-form textarea:focus {

            border-color:
                var(--dashboard-red);

        }


        .review-photo {

            margin:
                16px 0;

        }


        .review-photo label {

            display: block;

            font-size: 10px;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 0.8px;

            margin-bottom: 8px;

        }


        .review-submit {

            border: none;

            background:
                var(--dashboard-ink);

            color: white;

            padding:
                14px 20px;

            border-radius: 8px;

            font-weight: 800;

            cursor: pointer;

        }


        .review-success {

            display: none;

            margin-top: 18px;

            padding: 17px;

            background:
                #e8f5eb;

            border-left:
                4px solid var(--dashboard-green);

            color:
                #23673a;

            font-size: 13px;

        }


        .review-success.show {

            display: block;

        }


        /* =========================================================
           EMPTY
           ========================================================= */

        .empty-state {

            text-align: center;

            padding:
                70px 20px;

            color:
                var(--dashboard-muted);

        }


        .empty-state-icon {

            width: 55px;

            height: 55px;

            border-radius: 50%;

            background:
                #eeeae2;

            display: flex;

            align-items: center;

            justify-content: center;

            margin:
                0 auto 15px;

            font-size: 23px;

        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 850px) {

            .dashboard-grid {

                grid-template-columns:
                    1fr;

            }


            .status-card {

                align-items:
                    flex-start;

                flex-direction:
                    column;

            }


            #reliefMap {

                height: 400px;

            }

        }


        @media (max-width: 560px) {

            .dashboard-page {

                width: 94%;

                padding-top: 35px;

            }


            .dashboard-nav {

                padding:
                    0 3%;

            }


            .user-name {

                display: none;

            }


            .info-grid,
            .partner-details {

                grid-template-columns:
                    1fr;

            }


            .info-item.full {

                grid-column:
                    auto;

            }


            .dashboard-heading h1 {

                font-size: 46px;

            }

        }

    </style>

</head>


<body>


<!-- ============================================================
     NAVBAR
     ============================================================ -->

<header class="dashboard-nav">

    <div class="dashboard-brand">

        <span></span>

        RELIEF RESOLVER

    </div>


    <div class="dashboard-user">

        <div
            class="user-avatar"
            id="userAvatar"
        >
            J
        </div>

        <span
            class="user-name"
            id="userName"
        >
            User
        </span>

        <button
            class="logout-button"
            id="logoutButton"
        >
            Logout
        </button>

    </div>

</header>



<main class="dashboard-page">


    <!-- ========================================================
         HEADER
         ======================================================== -->

    <section class="dashboard-heading">

        <div class="dashboard-eyebrow">
            Your Relief Dashboard
        </div>

        <h1>
            You're not
            <em>alone.</em>
        </h1>

        <p>
            Track your emergency request, see the relief
            organization helping you, and confirm when
            assistance reaches you.
        </p>

    </section>



    <!-- ========================================================
         STATUS
         ======================================================== -->

    <section class="status-card">

        <div>

            <div class="status-label">
                Current request
            </div>

            <div
                class="status-title"
                id="statusTitle"
            >
                Loading your request...
            </div>

        </div>


        <div
            class="status-pill"
            id="statusPill"
        >
            LOADING
        </div>

    </section>



    <!-- ========================================================
         MAIN GRID
         ======================================================== -->

    <div id="dashboardContent">


        <!-- JS fills this -->

        <div class="empty-state">

            <div class="empty-state-icon">
                ⏳
            </div>

            Loading your relief information...

        </div>

    </div>


</main>



<!-- ============================================================
     INDIVIDUAL DASHBOARD ACCESS CONTROL
     ============================================================ -->
<script>
(function protectIndividualDashboard() {

    const role = sessionStorage.getItem("reliefAccountRole");

    const individualLoggedIn =
        sessionStorage.getItem("reliefUserLoggedIn") === "true";

    const ngoLoggedIn =
        sessionStorage.getItem("reliefNgoLoggedIn") === "true";

    const staffLoggedIn =
        sessionStorage.getItem("reliefStaffLoggedIn") === "true";

    /* NGO must NEVER see the individual dashboard. */
    if (ngoLoggedIn || role === "ngo") {
        window.location.replace("index.html");
        return;
    }

    /* Staff belongs in the Control Room. */
    if (staffLoggedIn || role === "staff") {
        window.location.replace("dispatcher.html");
        return;
    }

    /* Only a logged-in individual may use this page. */
    if (!individualLoggedIn || role !== "individual") {
        window.location.replace("login.html");
        return;
    }

})();
</script>

<!-- LEAFLET -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script
    src="js/individual-dashboard.js"
></script>


</body>

</html>
