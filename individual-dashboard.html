<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Relief Dashboard — Relief Resolver</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        :root {
            --paper: #f6f2ea;
            --white: #fffdf9;
            --ink: #071525;
            --muted: #64758a;
            --line: #ded8cd;
            --red: #b83d34;
            --green: #2f8b52;
            --yellow: #d99622;
            --blue: #326da5;
            --soft-green: #edf7ef;
            --soft-yellow: #fff5dc;
            --soft-red: #fdf0ed;
            --shadow: 0 15px 45px rgba(7, 21, 37, .07);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background:
                radial-gradient(
                    circle at 90% 0%,
                    rgba(184, 61, 52, .07),
                    transparent 30%
                ),
                var(--paper);
            color: var(--ink);
            font-family: Inter, sans-serif;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* NAVBAR */

        .dashboard-nav {
            min-height: 72px;
            padding: 0 max(28px, calc((100vw - 1180px) / 2));
            background: rgba(255, 253, 249, .96);
            border-bottom: 1px solid var(--line);

            display: flex;
            align-items: center;
            justify-content: space-between;

            position: sticky;
            top: 0;
            z-index: 1000;

            backdrop-filter: blur(12px);
        }

        .dashboard-brand {
            display: flex;
            align-items: center;

            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .dashboard-brand span {
            width: 8px;
            height: 8px;
            margin-right: 9px;

            border-radius: 50%;
            background: var(--red);
        }

        .dashboard-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 38px;
            height: 38px;

            border-radius: 50%;
            background: var(--ink);
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: 800;
        }

        .user-name {
            font-size: 13px;
            font-weight: 700;
        }

        .logout-button {
            border: 0;
            background: transparent;
            color: var(--red);

            font-size: 11px;
            font-weight: 800;

            padding: 8px 0 8px 12px;
        }

        /* PAGE */

        .dashboard-page {
            width: min(1180px, calc(100% - 42px));
            margin: auto;
            padding: 50px 0 80px;
        }

        .dashboard-heading {
            margin-bottom: 30px;
        }

        .eyebrow {
            color: var(--red);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        .dashboard-heading h1 {
            margin: 8px 0 0;

            font-family: Fraunces, Georgia, serif;
            font-size: clamp(46px, 6vw, 68px);
            line-height: .98;
            letter-spacing: -2.4px;
        }

        .dashboard-heading h1 em {
            color: var(--red);
            font-weight: 500;
        }

        .dashboard-heading p {
            max-width: 720px;
            margin: 16px 0 0;

            color: var(--muted);
            font-size: 15px;
            line-height: 1.65;
        }

        /* STATUS */

        .dashboard-status {
            min-height: 105px;
            margin-bottom: 24px;
            padding: 24px 26px;

            border-radius: 17px;
            background: var(--ink);
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            box-shadow: 0 18px 45px rgba(7, 21, 37, .12);
        }

        .dashboard-status h2 {
            margin: 7px 0 0;

            color: white;
            font-size: 21px;
            line-height: 1.3;
        }

        .dashboard-status .eyebrow {
            color: rgba(255,255,255,.58);
        }

        .status-pill {
            padding: 10px 15px;

            border-radius: 999px;
            background: rgba(255,255,255,.1);

            color: white;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: .8px;
            white-space: nowrap;
        }

        .dashboard-status.pending .status-pill {
            color: #ffd989;
        }

        .dashboard-status.verified .status-pill,
        .dashboard-status.received .status-pill {
            color: #8ce3a8;
        }

        .dashboard-status.coordinating .status-pill {
            color: #8cc7ff;
        }

        /* GRID */

        .dashboard-grid {
            display: grid;
            grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr);
            gap: 24px;
        }

        .dashboard-card {
            min-width: 0;

            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 18px;

            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .card-heading {
            padding: 24px 26px 20px;
            border-bottom: 1px solid var(--line);
        }

        .card-heading h2 {
            margin: 7px 0 0;
            font-size: 21px;
            line-height: 1.25;
        }

        .card-heading p {
            margin: 7px 0 0;

            color: var(--muted);
            font-size: 12px;
            line-height: 1.55;
        }

        /* REQUEST */

        .request-number-box {
            margin: 20px 26px 18px;
            padding: 14px 16px;

            border-left: 4px solid var(--red);
            border-radius: 8px;
            background: #f1ede4;
        }

        .request-number-box span,
        .stat span,
        .situation-box span {
            display: block;

            color: var(--muted);
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 1.1px;
            text-transform: uppercase;
        }

        .request-number-box strong {
            display: block;
            margin-top: 6px;

            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .request-location {
            display: flex;
            gap: 10px;
            padding: 0 26px 18px;
        }

        .location-pin {
            width: 28px;
            height: 28px;
            flex: 0 0 auto;

            border-radius: 50%;
            background: var(--soft-red);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .request-location strong {
            display: block;
            font-size: 14px;
            line-height: 1.45;
        }

        .request-location small {
            display: block;
            margin-top: 4px;

            color: var(--muted);
            font-size: 10px;
        }

        .request-stats {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;

            padding: 0 26px 18px;
        }

        .stat {
            padding: 15px;
            border-radius: 11px;
            background: #f5f1e9;
        }

        .stat:last-child {
            grid-column: 1 / -1;
        }

        .stat strong {
            display: block;
            margin-top: 7px;

            font-size: 15px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .reporter-box {
            display: flex;
            align-items: center;
            gap: 11px;

            margin: 0 26px 18px;
        }

        .reporter-avatar {
            width: 36px;
            height: 36px;
            flex: 0 0 auto;

            border-radius: 50%;
            background: var(--ink);
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 13px;
            font-weight: 800;
        }

        .reporter-box strong {
            display: block;
            font-size: 13px;
        }

        .reporter-box span {
            display: block;
            margin-top: 3px;

            color: var(--muted);
            font-size: 10px;
        }

        .situation-box {
            margin: 0 26px 26px;
            padding: 15px;

            border: 1px solid var(--line);
            border-radius: 10px;
            background: #faf8f3;
        }

        .situation-box p {
            margin: 7px 0 0;

            font-size: 12px;
            line-height: 1.55;
        }

        /* PENDING MESSAGE */

        .pending-panel {
            margin-top: 24px;
            padding: 24px;

            border: 1px solid #ecd8a9;
            border-radius: 15px;
            background: var(--soft-yellow);

            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .pending-icon {
            width: 40px;
            height: 40px;
            flex: 0 0 auto;

            border-radius: 50%;
            background: #fff0c8;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 19px;
        }

        .pending-panel strong {
            display: block;
            font-size: 14px;
        }

        .pending-panel p {
            margin: 6px 0 0;

            color: #7a642e;
            font-size: 12px;
            line-height: 1.6;
        }

        /* MAP */

        .map-card {
            display: flex;
            flex-direction: column;
        }

        .individual-map {
            width: 100%;
            height: 510px;
            min-height: 510px;
            background: #e6e3dc;
        }

        .map-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;

            padding: 13px 18px;
            border-top: 1px solid var(--line);

            background: var(--white);

            color: var(--muted);
            font-size: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .legend-marker {
            width: 20px;
            height: 20px;

            border-radius: 50%;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 9px;
            font-weight: 800;
        }

        .individual-marker {
            background: var(--red);
        }

        .ngo-marker {
            background: var(--green);
            border-radius: 6px;
        }

        /* NGO SECTION */

        .full-width {
            margin-top: 24px;
        }

        .count-pill {
            padding: 7px 11px;

            border-radius: 999px;
            background: #edf5ef;
            color: var(--green);

            font-size: 8px;
            font-weight: 800;
            letter-spacing: .7px;
            white-space: nowrap;
        }

        .ngo-list {
            padding: 4px 26px 10px;
        }

        .ngo-list-item {
            display: grid;
            grid-template-columns: 48px minmax(0, 1fr) auto;

            align-items: center;
            gap: 13px;

            padding: 17px 0;
            border-bottom: 1px solid var(--line);
        }

        .ngo-list-item:last-child {
            border-bottom: 0;
        }

        .ngo-icon {
            width: 46px;
            height: 46px;

            border-radius: 12px;

            background: var(--soft-green);
            border: 1px solid #cfe2d5;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
        }

        .ngo-main strong {
            display: block;
            font-size: 14px;
        }

        .ngo-main .verified {
            display: inline-block;
            margin-top: 4px;

            color: var(--green);
            font-size: 9px;
            font-weight: 800;
        }

        .ngo-main small {
            display: block;
            margin-top: 4px;

            color: var(--muted);
            font-size: 10px;
        }

        .ngo-services {
            margin-top: 5px;

            color: var(--muted);
            font-size: 10px;
        }

        .ngo-distance {
            text-align: right;
        }

        .ngo-distance strong {
            display: block;
            font-size: 14px;
        }

        .ngo-distance span {
            display: block;
            margin-top: 3px;

            color: var(--muted);
            font-size: 9px;
        }

        .empty-mini {
            padding: 35px 20px;

            text-align: center;
            color: var(--muted);
            font-size: 12px;
        }

        /* COORDINATION */

        .coordination-box {
            margin: 24px 0;
            padding: 22px;

            border: 1px solid #cfe2d5;
            border-radius: 15px;
            background: var(--soft-green);
        }

        .coordination-box strong {
            display: block;
            color: #245e38;
            font-size: 14px;
        }

        .coordination-box p {
            margin: 7px 0 0;

            color: #4b7057;
            font-size: 12px;
            line-height: 1.6;
        }

        /* REVIEW */

        .review-section {
            margin-top: 24px;
        }

        .primary-button {
            margin: 20px 26px;

            padding: 13px 18px;

            border: 0;
            border-radius: 8px;

            background: var(--ink);
            color: white;

            font-size: 10px;
            font-weight: 800;
            letter-spacing: .5px;
        }

        .primary-button:hover {
            transform: translateY(-1px);
        }

        .review-form {
            display: none;

            margin: 0 26px 26px;
            padding: 20px;

            border: 1px solid var(--line);
            border-radius: 12px;
            background: #faf8f3;
        }

        .review-form.show {
            display: block;
        }

        .rating-label {
            color: var(--muted);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .stars {
            display: flex;
            gap: 5px;
            margin-top: 9px;
        }

        .star {
            width: 38px;
            height: 38px;

            border: 1px solid var(--line);
            border-radius: 8px;

            background: white;

            font-size: 19px;
        }

        .star.selected {
            background: #fff0c8;
            border-color: #e1b45a;
            color: #b57a0d;
        }

        #reviewText {
            width: 100%;
            min-height: 110px;

            margin-top: 15px;
            padding: 13px;

            resize: vertical;

            border: 1px solid var(--line);
            border-radius: 9px;

            background: white;
        }

        #reviewPhoto {
            width: 100%;
            margin-top: 12px;
            font-size: 11px;
        }

        .review-success {
            display: none;

            margin-top: 12px;
            padding: 12px;

            border-radius: 8px;
            background: var(--soft-green);
            color: var(--green);

            font-size: 11px;
            font-weight: 700;
        }

        .review-success.show {
            display: block;
        }

        /* EMPTY */

        .empty-state {
            padding: 55px 30px;

            border: 1px solid var(--line);
            border-radius: 18px;

            background: var(--white);
            text-align: center;

            box-shadow: var(--shadow);
        }

        .empty-state h2 {
            margin: 15px 0 7px;
        }

        .empty-state p {
            margin: 0 auto 20px;

            max-width: 420px;

            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .empty-icon {
            width: 48px;
            height: 48px;
            margin: auto;

            border-radius: 50%;
            background: var(--soft-yellow);

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: 800;
        }

        /* MOBILE */

        @media (max-width: 850px) {

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .individual-map {
                height: 420px;
                min-height: 420px;
            }

        }

        @media (max-width: 600px) {

            .dashboard-nav {
                padding: 0 18px;
            }

            .dashboard-page {
                width: calc(100% - 28px);
                padding-top: 34px;
            }

            .user-name {
                display: none;
            }

            .dashboard-heading h1 {
                font-size: 46px;
            }

            .dashboard-status {
                align-items: flex-start;
                flex-direction: column;
            }

            .request-stats {
                grid-template-columns: 1fr;
            }

            .stat:last-child {
                grid-column: auto;
            }

            .ngo-list-item {
                grid-template-columns: 44px minmax(0, 1fr);
            }

            .ngo-distance {
                grid-column: 2;
                text-align: left;
            }

        }

    </style>
</head>


<body>

<header class="dashboard-nav">

    <div class="dashboard-brand">
        <span></span>
        RELIEF RESOLVER
    </div>

    <div class="dashboard-user">

        <div
            class="user-avatar"
            id="userAvatar"
        >
            U
        </div>

        <span
            class="user-name"
            id="userName"
        >
            User
        </span>

        <button
            class="logout-button"
            id="logoutButton"
            type="button"
        >
            Logout
        </button>

    </div>

</header>


<main class="dashboard-page">

    <section class="dashboard-heading">

        <div class="eyebrow">
            Your Relief Dashboard
        </div>

        <h1>
            You're not
            <em>alone.</em>
        </h1>

        <p>
            Track your emergency request and see relief
            organizations near your emergency location once
            the Control Room verifies your request.
        </p>

    </section>


    <div id="dashboardContent"></div>

</main>


<script>

(function protectIndividualDashboard() {

    const role =
        sessionStorage.getItem("reliefAccountRole");

    const individualLoggedIn =
        sessionStorage.getItem("reliefUserLoggedIn") === "true";

    const ngoLoggedIn =
        sessionStorage.getItem("reliefNgoLoggedIn") === "true";

    const staffLoggedIn =
        sessionStorage.getItem("reliefStaffLoggedIn") === "true";


    if (
        ngoLoggedIn ||
        role === "ngo"
    ) {
        window.location.replace("index.html");
        return;
    }


    if (
        staffLoggedIn ||
        role === "staff"
    ) {
        window.location.replace("dispatcher.html");
        return;
    }


    if (
        !individualLoggedIn ||
        role !== "individual"
    ) {
        window.location.replace("login.html");
        return;
    }

})();

</script>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script src="js/individual-dashboard.js"></script>

</body>
</html>
